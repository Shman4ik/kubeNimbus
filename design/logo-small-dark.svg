      <path d="M453.1 328.6 L648.3 279.5"/>
      <path d="M453.1 328.6 L593.2 473.1"/>
    </g>
    <g stroke-width="51.4">
      <path d="M387.6 558.6 L372.9 610.3"/>
      <path d="M221.1 386.9 L169.1 400"/>
      <path d="M286.6 156.8 L249.3 118.3"/>
      <path d="M518.6 98.5 L533.3 46.9"/>
      <path d="M685.1 270.3 L737.2 257.2"/>
      <path d="M619.6 500.4 L656.9 538.9"/>
    </g>
  </g>
  <circle class="ink" fill="#F5F7FA" cx="453.1" cy="328.6" r="80.5"/>

