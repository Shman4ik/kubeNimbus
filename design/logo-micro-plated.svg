      <path d="M530.1 360.2 L348.6 262.5"/>
      <path d="M530.1 360.2 L627.8 178.6"/>
      <path d="M530.1 360.2 L711.7 457.9"/>
    </g>
  </g>
  <circle class="ink" fill="#242B36" cx="530.1" cy="360.2" r="82.5"/>

