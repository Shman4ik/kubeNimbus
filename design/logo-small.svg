<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="logo-small-title">
  <title id="logo-small-title">kubeNimbus</title>

  <!-- ============================================================
       kubeNimbus logo - SIMPLIFIED SMALL MASTER (24 px).

       GENERATED by scripts/design/make-small-masters.py from
       design/logo.svg. Do not hand-edit: re-run the script.

       Not a downscale of the full mark. At 24px logo.svg's traced
       light field, its eight thin helm spokes and the broom's
       ferrule notch all fall under one pixel and collapse into mud
       (design/LOGO-ASSETS.md, "Why there are three masters").

       NO DISC. The full mark's disc is a plate, and a plate costs
       ~20% of the tile in each direction at every size; at 24px
       that is the difference between six readable spokes and a
       grey ring. This master is one colour on transparency and
       gets the whole tile - which is what the unplated Windows and
       MSIX icon slots want anyway. It cannot carry its own
       background, so on a surface the ink will not survive,
       logo-small-dark.svg is not optional, it is the asset. The
       plated twin for app.ico is logo-small-plated.svg.

       The broom is logo.svg's OWN geometry, not a redrawn wedge -
       the same #broom-bristles and #broom-handle paths, scaled.
       That is what the pass which made #brand-broom self-contained
       bought: the small mark and the full mark are now the same
       broom, and keeping them that way is a re-run, not a redraw.

       The helm is WHOLE. The full mark cuts a clearance gap where
       the broom crosses; here the broom is placed at the closest
       distance that leaves every spoke, peg and rim arc intact,
       and its ray phase puts it dead centre of a gap between
       spokes. At this size a chopped spoke does not read as depth,
       it reads as a rendering fault.
       ============================================================ -->

  <style>
    .ink   { fill: #242B36 }
    .ink-s { stroke: #242B36 }
  </style>

  <!-- Helm, whole: see the header note on why nothing is cut. -->
  <g class="ink-s" stroke="#242B36" stroke-linecap="butt" fill="none">
    <g stroke-width="76">
      <circle cx="449.2" cy="328.7" r="201.3"/>
    </g>
    <g stroke-width="67.1">
      <path d="M449.2 328.7 L396.7 523"/>
      <path d="M449.2 328.7 L254.7 380.3"/>
      <path d="M449.2 328.7 L307.2 186"/>
      <path d="M449.2 328.7 L501.8 134.4"/>
      <path d="M449.2 328.7 L643.8 277.1"/>
      <path d="M449.2 328.7 L591.2 471.4"/>
    </g>
    <g stroke-width="51.4">
      <path d="M386.7 559.7 L372.7 611.5"/>
      <path d="M217.9 390.1 L166 403.9"/>
      <path d="M280.4 159.1 L242.5 121"/>
      <path d="M511.7 97.7 L525.7 45.9"/>
      <path d="M680.5 267.3 L732.4 253.6"/>
      <path d="M618 498.3 L655.9 536.4"/>
    </g>
  </g>
  <circle class="ink" fill="#242B36" cx="449.2" cy="328.7" r="80.5"/>

  <!-- The broom: logo.svg's own #broom-bristles and #broom-handle,
       fattened by a 27.7 stroke so the hairline gaps around the ferrule
       fuse instead of turning to mud. -->
