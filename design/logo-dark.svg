<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="logo-title">
  <title id="logo-title">kubeNimbus</title>

  <!-- ============================================================
       kubeNimbus logo - flattened master.

       Every module is plain <path> geometry in the root coordinate
       system: no <mask>, no <use>, no transform, no CSS variables.
       That is what makes it survive Inkscape / Illustrator / Figma
       and what makes each group liftable into a sibling mark.

       #base         the disc and the light field it encloses
       #mascot-helm  the ship's helm
       #brand-broom  the Nimbus broom, shared across the family

       THE BROOM IS SELF-CONTAINED, and that is the point of this
       file's layout. It used to be a set of fragments that only
       read as a broom because #base's light field had the handle
       cut out of it as negative space: hide #base and the handle
       vanished, because it was never an object - it was a hole.
       Now #brand-broom carries every part it needs, including its
       own clearance halo (#broom-clearance: the same geometry,
       stroked 40 wide in .paper under the .ink, which is exactly
       the trick logo-small.svg uses). Lift the group onto any
       background and you get a whole broom.

       Two consequences worth knowing before editing:

       - #base's light field is now a clean arc. The notch that
         used to spell the handle, and the wiggles that used to
         spell the halo around the bristles, are gone - the broom
         draws both itself. Do not "restore" them; you would be
         drawing the broom twice.
       - #mascot-helm still has the broom's clearance gap baked
         into its outline (the flattened path cannot be un-baked
         without redrawing the helm parametrically). It is
         invisible, because #broom-clearance covers it exactly -
         both are the same 20px margin. But the helm alone is not
         yet liftable the way the broom is.

       The handle is ONE closed path from ferrule to tip, not a
       shaft plus a grip: two abutting fills leave an antialiasing
       hairline right where the eye follows the stroke. The grip's
       slot is .paper punched over the .ink, so the whole handle
       reads as one dark object with a white outline, which is what
       lets it cross the dark ring and stay legible.

       Colour is two classes, .ink and .paper (plus .paper-s for
       the clearance stroke). The fill/stroke attribute repeats the
       value so tools that ignore <style> still render; CSS wins
       where it is honoured, so a host page can retheme the mark
       without touching the geometry. logo-dark.svg is the same
       bytes with the two values exchanged.
       ============================================================ -->

  <style>
    .ink     { fill: #F5F7FA }
    .paper   { fill: #242B36 }
    .paper-s { stroke: #242B36 }
  </style>

  <!-- Base: the ring and the light field it encloses. -->
  <g id="base">
    <circle class="ink" fill="#F5F7FA" cx="512" cy="512" r="512"/>
    <path class="paper" fill="#242B36" d="M 524.77 128.49 C 513.11 128.06 501.31 128.22 489.4 129 C 301.4 141.2 158.9 295.1 152 482.4 C 150.5 522.2 154.9 561.9 165.2 600.2 C 167.9 610 169.2 620.5 174.6 629.1 C 241.1 735 272.6 806 390.2 848.3 C 454.8 871.5 524.4 876 591.4 860.8 C 724 830.6 824.8 726 858.5 595.8 C 871 547.9 874.5 497.1 867.5 448 C 866.1 438.7 864.7 429.4 862.9 420.2 C 861.7 413.9 860.1 407.6 858.4 401.3 C 857.61 398.13 856.12 396.23 855.9 396.3 C 848.85 382.2 844.14 366.8 841.2 351.3 C 840.1 345.5 834.4 334.3 833 331.3 C 820.3 304.9 804.3 280.9 786.1 257.9 C 774 242.7 759.6 228.9 744.7 216.4 C 681.44 163.29 606.38 131.46 524.77 128.49 z"/>
  </g>

