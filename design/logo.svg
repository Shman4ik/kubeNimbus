<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">kubeNimbus</title>

  <!-- ============================================================
       kubeNimbus logo.

       #base and #brand-broom are traced from
       design/Gemini_Generated_Image_bju2ipbju2ipbju2.png at the 128
       iso-level (sub-pixel marching squares, cubic-Bezier fit to within
       0.75px), so they are the source artwork's own geometry.

       #mascot-helm is NOT traced: the generated wheel had 7 spokes at
       44-60deg spacing and only half its handles, so it is rebuilt from
       the measured radii (rim 137.8-172.8, handles to 237.8, centre
       511,454) on an exact 45deg grid -
       symmetric by construction rather than by hand-placed nodes.

       Arms sit at 0, 45, 90, 150, 210, 270, 315deg. Everything outside the broom's
       shadow is on the exact 45deg grid; inside it the 180deg arm is dropped
       and its neighbours pulled together (135->150, 225->210) so the wedge the
       broom cuts carries two spokes rather than three stubs.

       The whole mark is scaled 1.111x off the source so the disc
       runs edge to edge: cx=cy=r=512, no margin.

       The broom passes in front of the wheel with a light gap around it,
       so the wheel is masked by #broom-clearance: the broom's own outline
       widened by 17px, the gap measured off the source.
       ============================================================ -->
  <style>
    svg { --ink: #242B36; --paper: #F5F7FA; }
  </style>

  <defs>
    <!-- one arm: spoke + handle, pointing up -->
    <g id="helm-arm">
      <rect x="-16.65" y="-155.3" width="33.3" height="111.30000000000001" rx="16.65"/>
      <rect x="-16.65" y="-237.8" width="33.3" height="75" rx="16.65"/>
    </g>
    <!-- the broom where it crosses the disc -->
    <path id="broom-edge" d="M837,355.5C790.7,385.2 738.6,409.9 699.2,449.1C674,474.1 660,510.6 630.2,530.9C599.1,552.1 564.2,566.9 530.2,582.3C505.3,593.7 481,605.7 455.8,616.4C450.8,618.6 452.8,597.2 442.4,595.6C425.2,592.9 408.5,612.4 406.6,628C403.2,655.8 425,619.3 434.6,615.1C435.5,614.8 440,636.8 440,636.9C442.5,644.3 458.4,670.6 457.6,672.5C456.3,675.6 440.7,675.9 434.6,676.5C426,677.2 421.2,674.6 427.8,683.6C437,696.3 476.2,694.9 481.5,679.1C484.4,670.6 473.1,661.6 469.5,655.8C468.1,653.5 479.3,650.7 482.4,649.3C501.5,640.9 520.4,632.4 539.1,623.9C555.9,616.2 572.6,607.6 589.1,599.6C616.2,586.4 642.6,574.7 665.8,554.8C697.1,528 712.8,487.4 745.8,462.7C771.2,443.7 799.1,426.9 827,411.8C835.5,407.2 847.4,402.6 854.7,396.9C855.7,396.1 847.6,378.4 845.2,372.4C844.9,371.7 845.5,370.9 845.2,370.2C841.6,362.2 838.2,354.7 837,355.5Z"/>

    <!-- Where the wheel must not paint: the broom itself widened by the 18.9px
         gap measured off the source, plus everything behind it - the broom hides
         the wheel completely on its far side, and a bare band would leave a
         clipped handle floating out there. The far side is the broom's own
         outline stepped along its normal (-29.91deg axis), so the cut
         follows the broom's curve instead of a straight line. -->
    <mask id="broom-clearance">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="37.8" stroke-linejoin="round">
        <use href="#broom-edge"/>
        <use href="#broom-edge" transform="translate(19.9 34.7)"/>
        <use href="#broom-edge" transform="translate(39.9 69.3)"/>
        <use href="#broom-edge" transform="translate(59.8 104.0)"/>
        <use href="#broom-edge" transform="translate(79.8 138.7)"/>
        <use href="#broom-edge" transform="translate(99.7 173.4)"/>
        <use href="#broom-edge" transform="translate(119.7 208.0)"/>
        <use href="#broom-edge" transform="translate(139.6 242.7)"/>
        <use href="#broom-edge" transform="translate(159.6 277.4)"/>
        <use href="#broom-edge" transform="translate(179.5 312.0)"/>
        <use href="#broom-edge" transform="translate(199.5 346.7)"/>
        <use href="#broom-edge" transform="translate(219.4 381.4)"/>
        <use href="#broom-edge" transform="translate(239.4 416.1)"/>
      </g>
    </mask>
  </defs>

  <!-- Base: the ring and the light field it encloses. -->
  <g id="base">
    <circle cx="512" cy="512" r="512.0" fill="var(--ink)"/>
    <path fill="var(--paper)" d="M489.4,129C584.7,122.8 672.4,155.7 744.7,216.4C759.6,228.9 774,242.7 786.1,257.9C804.3,280.9 820.3,304.9 833,331.3C834.4,334.3 840.1,345.5 841.2,351.3C841.6,353.4 833.2,358.3 831.4,359.4C795.6,381.4 758.9,401.9 724.7,426.5C710.9,436.4 697.2,449 686.7,462.4C662.3,493.7 648.5,520.6 614.7,540.6C564.8,570.2 508,592.8 455.8,616.3C451.9,618 451,596.9 442.4,595.6C425.6,593 407.8,612.3 406.6,628C406.3,631.6 404.7,636 406.9,638.8C407.1,639.1 407.6,639 408,638.9C418.8,635.2 424.3,620.9 434.6,615.4C435.2,615.1 435.4,616.3 435.6,616.9C436.1,619.1 436.2,621.4 436.7,623.6C438.6,632.5 439.1,635.4 442.2,642.5C446.5,652.4 458.2,671.6 457.6,672.5C451.4,681.6 435.6,675.5 424.6,676.9C424,677 423.6,678.4 427.7,683.6C429.3,685.5 431.3,687.3 433.5,688.4C435.3,689.2 437.2,690 439.1,690.4C448.7,692.8 480.1,692.6 481.5,679.1C482,674.8 480.6,670.5 478.1,666.9C475.4,663 466.2,656.7 470.5,654.7C564.4,611.6 511.7,637.6 598,596.1C617.4,586.7 637.5,577.1 654.7,563.9C687,539 703.9,503.1 732.1,474.7C745.5,461.2 762,450.7 778.1,440.8C789.3,434 840.7,403.6 855.9,396.3C856.1,396.2 857.6,398.1 858.4,401.3C860.1,407.6 861.7,413.9 862.9,420.2C864.7,429.4 866.1,438.7 867.5,448C874.5,497.1 871,547.9 858.5,595.8C824.8,726 724,830.6 591.4,860.8C524.4,876 454.8,871.5 390.2,848.3C373.1,842.1 364.5,837.7 345.7,828.5C339.7,825.5 331.9,820.9 332.2,820.3C334.1,816 348.1,806.5 351.9,802.5C372.3,781.2 389.3,759.7 405,734.7C414,720.4 414,724.5 402.4,719.6C399.7,718.5 396.7,713.5 394.6,715.6C384.8,725.4 379.7,739 371.7,750.3C366.8,757.2 361.4,763.8 355.9,770.3C311.5,823.2 231.1,862.1 161.3,853.1C159.2,852.8 161.6,845.5 161.9,844.7C163.4,840.3 166.1,835.2 168.6,831.4C170.9,827.9 174.3,825.1 176.2,821.4C176.6,820.7 176.7,820 175.7,819.9C158.7,817.7 162.5,819.3 144.6,815.1C121.9,809.7 82,791.2 75.1,765.8C74.2,762.5 94.9,756.8 99,754.9C114.4,747.9 127.1,738.5 139.3,726.9C142.3,724.1 146.4,721.9 148,718C149.2,715.2 153.2,718.2 137.9,716.2C133.8,715.6 129.7,715 125.7,714C121.5,713 115.4,709.7 116.4,708C120.2,701.7 127,694.2 132.1,689.1C156.4,664.7 180.4,644.9 213.5,633.1C245.4,621.7 279.9,619.5 313.5,623.2C321,624 328.4,625.2 335.7,626.5C343.9,628 356.6,638.5 360.2,631.1C361.3,628.7 361.7,626 362.8,623.6C392.5,559.4 341.6,671.9 369,615.8C369,615.8 372.2,615.1 360.2,612.2C341.6,607.6 322.6,604.7 303.5,603.2C275.7,600.9 247.1,603.4 220.2,611C212.5,613.1 202.1,616.4 194.6,619.8C188.6,622.6 182.8,625.8 176.8,628.6C176.1,628.9 175,629.7 174.6,629.1C169.2,620.5 167.9,610 165.2,600.2C154.9,561.9 150.5,522.2 152,482.4C158.9,295.1 301.4,141.2 489.4,129Z"/>
  </g>

  <!-- Product mascot: the ship's helm (pgNimbus uses an elephant here). -->
  <!-- the mask lives on the outer <g>: a transform on the same element as a
       mask would move the mask with it -->
  <g id="mascot-helm" mask="url(#broom-clearance)">
    <g fill="var(--ink)" transform="translate(510.8 453.5)">
      <circle r="155.3" fill="none" stroke="var(--ink)" stroke-width="35"/>
      <g id="helm-arms">
      <use href="#helm-arm" transform="rotate(0)"/>
      <use href="#helm-arm" transform="rotate(45)"/>
      <use href="#helm-arm" transform="rotate(90)"/>
      <use href="#helm-arm" transform="rotate(150)"/>
      <use href="#helm-arm" transform="rotate(210)"/>
      <use href="#helm-arm" transform="rotate(270)"/>
      <use href="#helm-arm" transform="rotate(315)"/>
      </g>
      <path id="helm-hub" fill-rule="evenodd"
            d="M0,-50 A50,50 0 1,1 0,50 A50,50 0 1,1 0,-50 Z
               M0,-25.6 A25.6,25.6 0 1,1 0,25.6 A25.6,25.6 0 1,1 0,-25.6 Z"/>
    </g>
  </g>

  <!-- Brand emblem: the Nimbus broom, shared across the family. -->
  <g id="brand-broom">
    <path fill="var(--ink)" d="M273.5,641.3C236.6,644 202,655.1 172.4,677.9C167.8,681.4 163.4,685.1 159,688.8C156.7,690.9 151.7,692.8 152.7,695.8C152.8,696.1 153.2,696.2 153.5,696.2C164.1,696.7 174.3,691.2 184.6,688.6C187.1,688 192.1,685.5 192.2,688C192.7,694.4 186.2,699.4 182.6,704.7C170.3,722.7 157.2,739.1 140.1,752.7C134.8,757 129.4,760.5 123.5,764C117.8,767.3 110.2,768.3 106.4,773.6C105.7,774.6 116.8,782.1 117.9,782.8C130.1,790.1 144.9,796.3 159,798.3C178.4,801 198.1,799.7 216.8,793.8C224.2,791.5 247.3,779.4 249.1,781.3C251,783.5 243.1,795.3 242.8,795.8C236.8,805.8 228.6,814.2 219,820.8C213.8,824.4 197.1,832.2 203.5,831.8C251.5,828.9 306,798.4 337,762.5C350.6,746.6 359.3,733.6 371.3,715.8C373.9,711.9 366.8,707.6 364.4,703.6C361,697.9 356.3,687.3 354.2,682.5C352.7,678.8 351.1,675.1 349.9,671.4C347.2,663.7 348.2,653.9 342.4,648.2C337.6,643.4 329.1,645.4 322.4,644.3C306.5,641.8 289.6,640.2 273.5,641.3Z"/>
    <path fill="var(--paper)" d="M926.8,308C952.7,305.9 951.1,347.9 939.3,361.3C928.1,374 916.7,373.5 899.2,378.6C884.7,382.9 872,389.5 858.1,395.2C856.6,395.8 856.3,391.8 851.7,378C849,369.8 845.9,361.7 843.2,353.5C843.1,353.2 843,352.6 843.3,352.4C858.2,343.3 885.4,327.4 901.4,318.7C907.5,315.4 918.5,308.6 926.8,308Z"/>
    <path fill="var(--ink)" d="M388,625.6C385.6,626.5 379.7,628.6 377.4,631.4C373.3,636.2 376.6,645.8 377.8,650.3C381.6,663.9 387.5,678 394.4,690.3C395.2,691.6 402.8,706 408,703.8C426.6,696 419.1,694.4 410.8,678C407.6,671.8 404.6,665.5 401.8,659.1C398.7,651.8 395.7,644.4 393.1,636.9C391.4,632 391.7,624.2 388,625.6Z"/>
    <path fill="var(--ink)" d="M924.8,327.6C916.6,331.3 903.3,337.4 894.7,342.3C891.4,344.2 883.8,345.6 885.4,349.1C887,352.5 889,355.8 891,359.1C892.1,360.9 892.8,360.8 894.7,360.3C909.6,356.5 927.2,357 928.3,339.1C928.6,334.4 929.3,325.5 924.8,327.6Z"/>
  </g>
</svg>
