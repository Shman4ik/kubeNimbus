# A healthy, ordinary web app: Deployment + Service + Ingress + ConfigMap +
# Secret, with literal / configMapKeyRef / secretKeyRef / envFrom env vars so
# pod detail's Environment tab (and its per-key Reveal) has something to show.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: demo-shop
data:
  LOG_LEVEL: info
  FEATURE_FLAGS: "checkout-v2,recommendations"
  UPSTREAM_URL: http://shop-api.demo-shop.svc.cluster.local:8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-web-content
  namespace: demo-shop
data:
  index.html: |
    <!doctype html>
    <title>kubeNimbus sandbox</title>
    <h1>shop-web</h1>
    <p>Sandbox workload. Nothing here is real.</p>
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-credentials
  namespace: demo-shop
type: Opaque
# Obviously-fake sandbox values — never anything resembling a real credential.
stringData:
  DATABASE_PASSWORD: sandbox-not-a-real-password
  API_TOKEN: sandbox-token-0000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: demo-shop
  labels:
    app: shop-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop-web
  template:
    metadata:
      labels:
        app: shop-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_NAME
              value: shop-web
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: LOG_LEVEL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shop-credentials
                  key: API_TOKEN
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: shop-config
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 128Mi }
        # A second container so the container picker / log container switch and
        # per-container usage charts are exercised.
        - name: access-log-tailer
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              i=0; while true; do i=$((i+1));
              echo "$(date -Iseconds) INFO  tailer heartbeat $i";
              if [ $((i % 7)) -eq 0 ]; then echo "$(date -Iseconds) WARN  upstream slow (420ms)"; fi;
              if [ $((i % 23)) -eq 0 ]; then echo "$(date -Iseconds) ERROR upstream returned 502"; fi;
              sleep 3; done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
      volumes:
        - name: content
          configMap:
            name: shop-web-content
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: demo-shop
spec:
  selector:
    app: shop-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: demo-shop
  labels:
    app: shop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              while true; do
              echo "$(date -Iseconds) INFO  GET /api/orders 200 12ms";
              sleep 2;
              echo "$(date -Iseconds) DEBUG cache hit ratio 0.94";
              sleep 2; done
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-credentials
                  key: DATABASE_PASSWORD
          resources:
            requests: { cpu: 5m, memory: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: demo-shop
spec:
  selector:
    app: shop-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo-shop
spec:
  rules:
    - host: shop.sandbox.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-web
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-web
  namespace: demo-shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shop-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
