# Batch workloads. The CronJob fires every minute, so the list view keeps
# churning (new pods appear, complete and are GC'd) — which is what makes a
# live watch visibly live, and keeps Events flowing.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: demo-batch
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'echo "$(date -Iseconds) INFO  applying migrations"; sleep 5; echo "$(date -Iseconds) INFO  done, 7 migrations applied"'
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-generator
  namespace: demo-batch
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command:
                - sh
                - -c
                - 'echo "$(date -Iseconds) INFO  generating report"; sleep 15; echo "$(date -Iseconds) INFO  report written"'
              resources:
                requests: { cpu: 5m, memory: 8Mi }
---
# A CronJob that fails on purpose, so failed Jobs and Warning events exist too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flaky-export
  namespace: demo-batch
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: export
              image: busybox:1.36
              command:
                - sh
                - -c
                - 'echo "$(date -Iseconds) ERROR export failed: connection refused" >&2; exit 1'
              resources:
                requests: { cpu: 5m, memory: 8Mi }
