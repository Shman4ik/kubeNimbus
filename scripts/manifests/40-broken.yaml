# Deliberately unhealthy workloads. UI rule 8 says every state gets an explicit
# visual — these are how you actually see them: CrashLoopBackOff (error pill),
# ImagePullBackOff, an unschedulable Pending pod, and a container that never
# passes readiness (0/1 Ready while Running).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: demo-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'echo "$(date -Iseconds) ERROR cannot connect to database: dial tcp 10.0.0.9:5432: connection refused" >&2; sleep 3; exit 1'
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: demo-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-image
  template:
    metadata:
      labels:
        app: bad-image
    spec:
      containers:
        - name: app
          image: nginx:this-tag-does-not-exist
---
apiVersion: v1
kind: Pod
metadata:
  name: unschedulable
  namespace: demo-broken
  labels:
    app: unschedulable
spec:
  nodeSelector:
    kubernetes.io/hostname: node-that-does-not-exist
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: never-ready
  namespace: demo-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: never-ready
  template:
    metadata:
      labels:
        app: never-ready
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date -Iseconds) WARN  still warming up\"; sleep 5; done"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "exit 1"]
            periodSeconds: 5
          resources:
            requests: { cpu: 5m, memory: 8Mi }
