# QA check R-5 (docs/qa/desktop-checks.md, #220): a context whose credential plugin sleeps
# 30 seconds and then fails, which is how a slow cluster looks to the app while it connects.
# It names the sandbox's own cluster entry (kubenimbus-sandbox), so it is only ever merged
# with the run's kubeconfig into a copy in the temp folder, never used alone. It holds no
# credential, and the plugin never returns one.
apiVersion: v1
kind: Config
contexts:
  - name: qa-slow-auth
    context:
      cluster: kubenimbus-sandbox
      user: qa-slow-auth
      namespace: qa-shop
users:
  - name: qa-slow-auth
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: pwsh
        args:
          - -NoProfile
          - -Command
          - "Start-Sleep -Seconds 30; [Console]::Error.WriteLine('qa-slow-auth: this plugin never returns a credential'); exit 1"
        interactiveMode: Never
