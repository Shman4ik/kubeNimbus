apiVersion: v1
kind: Config
clusters:
  - name: fake-cluster
    cluster:
      server: https://127.0.0.1:1
      insecure-skip-tls-verify: true
contexts:
  - name: fixture-cluster
    context:
      cluster: fake-cluster
      namespace: default
      user: fake-user
current-context: fixture-cluster
users:
  - name: fake-user
    user:
      token: fake-token-not-a-real-credential
