name: Release

# Tag-driven. Everything a release needs is derived from the tag: the version
# stamped into the binaries, the archive names, and the CHANGELOG section used
# as the release body. See CONTRIBUTING.md, "Cutting a release".
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true
      dry_run:
        description: 'Build and archive everything, but do not create a release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One failed RID must not cancel the others: knowing that only osx-arm64
      # broke is the useful outcome, and the rest are still worth inspecting.
      fail-fast: false
      matrix:
        include:
          # NativeAOT cannot cross-compile — each RID needs a runner of its own
          # architecture and OS, which is what this matrix is.
          - { os: windows-latest,  rid: win-x64,     archive: zip }
          - { os: ubuntu-latest,   rid: linux-x64,   archive: tar }
          # Free for public repositories; see CONTRIBUTING.md if this label ever
          # stops resolving.
          - { os: ubuntu-24.04-arm, rid: linux-arm64, archive: tar }
          - { os: macos-latest,    rid: osx-arm64,   archive: tar }

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ILCompiler links with clang against zlib; the hosted images don't
      # guarantee the dev headers. Xvfb and the X client libraries are for the
      # launch check below — Avalonia's X11 backend dlopens exactly these seven
      # and nothing else native. Windows and macOS runners have a window server
      # already, so only Linux needs a display supplying.
      - name: Install AOT toolchain prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev \
            xvfb libice6 libsm6 libx11-6 libxcursor1 libxext6 libxi6 libxrandr2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # A malformed version would otherwise surface as an unusable archive
          # name three jobs later.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semantic version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=kubeNimbus-$version-${{ matrix.rid }}" >> "$GITHUB_OUTPUT"
          # Windows Installer versions are numeric only — a prerelease label is
          # not a version it can compare, and WiX warns that honouring one is
          # "unpredictable and undefined" (measured: `wix build -d
          # Version=0.4.0-rc.1` emits WIX1148 three times and still produces an
          # MSI). So the MSI carries the numeric part and the file name keeps
          # the full version, exactly as the MSIX packaging already does.
          echo "msi_version=${version%%-*}" >> "$GITHUB_OUTPUT"

      # -p:Version overrides Directory.Build.props's VersionPrefix, so the tag —
      # not the checked-in value — is what ends up stamped in the binary.
      - name: Publish (NativeAOT)
        shell: bash
        run: >-
          dotnet publish src/KubeNimbus.App
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      # ---------------------------------------------------------------------
      # Launch check. Deliberately BEFORE staging: a binary that cannot start
      # must fail its matrix leg rather than be archived, checksummed and
      # attached to a public release. That is not hypothetical — v0.1.0 shipped
      # three RIDs that died on startup with `FileNotFoundException: The
      # resource /Assets/app.ico could not be found`, because this workflow
      # published each binary and never once ran it. See
      # src/KubeNimbus.App/WindowIcons.cs for the bug and
      # src/KubeNimbus.App/SmokeTest.cs for what `--smoke-test` asserts: the
      # real startup path, exit 0 only once the main window has opened and
      # composited a frame.
      #
      # NativeAOT cannot cross-compile, which is why this matrix has a runner
      # per RID in the first place — so each runner can also natively run the
      # binary it just built. fail-fast is off, so one broken RID still leaves
      # the others' results visible, and the `release` job needs `build`, so a
      # failed leg blocks the release itself.
      #
      # Each leg carries timeout-minutes as a backstop below the app's own 90s
      # watchdog: a process wedged beneath the .NET runtime would otherwise sit
      # on the runner for the job's full 45 minutes.
      # ---------------------------------------------------------------------
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" ./publish/${{ matrix.rid }}/kubeNimbus --smoke-test

      # Start-Process rather than the call operator: kubeNimbus.exe is built
      # WinExe (GUI subsystem), and PowerShell does not wait for a GUI-subsystem
      # child invoked with `&` — it returns immediately and leaves $LASTEXITCODE
      # meaningless, which would make this step pass unconditionally. -Wait
      # -PassThru gives a real exit code; the redirects then have to be echoed
      # by hand, since a GUI subsystem process has no console of its own.
      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = ".\publish\${{ matrix.rid }}\kubeNimbus.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' `
                             -Wait -PassThru -NoNewWindow `
                             -RedirectStandardOutput smoke-out.txt `
                             -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            throw "Launch check failed: $exe --smoke-test exited $($p.ExitCode). The published binary does not start."
          }

      - name: Launch check (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: ./publish/${{ matrix.rid }}/kubeNimbus --smoke-test

      # ---------------------------------------------------------------------
      # Installers. A zip and a tarball are what a developer wants; an MSI, a
      # .dmg and a .deb/.AppImage are what everyone else expects, and until this
      # every platform's instructions ended in "extract it and run the binary
      # from a terminal".
      #
      # Each format is built from the publish output the launch check above has
      # already run, and each is then smoke-launched AGAIN through its own
      # installed path — because what an installer can break is exactly what
      # publishing cannot: a file missing from the component group, a bundle
      # layout Gatekeeper refuses, a Depends list one library short of what the
      # X11 backend loads. The packages land in dist/, so the checksum and
      # upload steps below pick them up with no per-format wiring.
      # ---------------------------------------------------------------------
      - name: Build MSI (WiX)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # PublishDir and IconFile must be absolute: WiX resolves relative -d
          # values against the .wxs file's own directory, not the cwd.
          wix build installer/windows/Product.wxs `
            -d PublishDir=${{ github.workspace }}\publish\win-x64 `
            -d Version=${{ steps.version.outputs.msi_version }} `
            -d IconFile=${{ github.workspace }}\src\KubeNimbus.App\Assets\app.ico `
            -arch x64 `
            -o dist/${{ steps.version.outputs.name }}.msi

      # Installs it the way a user does — per-user and unelevated, so this needs
      # no admin runner — launches what landed in %LocalAppData%, and uninstalls
      # again: leaving the product registered would make a re-run of this job
      # hit an upgrade path instead of a clean first install.
      - name: Install check (MSI)
        if: matrix.rid == 'win-x64'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist/${{ steps.version.outputs.name }}.msi").Path
          $log = "msi-install.log"
          $install = Start-Process msiexec -ArgumentList "/i", "`"$msi`"", "/qn", "/l*v", $log -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 60
            throw "msiexec /i failed with $($install.ExitCode)"
          }

          $installed = Join-Path $env:LOCALAPPDATA "kubeNimbus\kubeNimbus.exe"
          if (-not (Test-Path $installed)) { throw "The MSI installed, but $installed is not there" }

          # Start-Process for the same reason the launch check above uses it:
          # kubeNimbus.exe is WinExe, and PowerShell does not wait for a
          # GUI-subsystem child invoked with the call operator.
          $p = Start-Process -FilePath $installed -ArgumentList '--smoke-test' `
                             -Wait -PassThru -NoNewWindow `
                             -RedirectStandardOutput msi-smoke-out.txt `
                             -RedirectStandardError msi-smoke-err.txt
          Get-Content msi-smoke-out.txt, msi-smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            throw "The installed MSI does not start: --smoke-test exited $($p.ExitCode)"
          }

          $uninstall = Start-Process msiexec -ArgumentList "/x", "`"$msi`"", "/qn" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "msiexec /x failed with $($uninstall.ExitCode)" }

      - name: Build .app bundle + .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/macos/build-app-bundle.sh
          ./scripts/macos/build-app-bundle.sh \
            publish/${{ matrix.rid }} '${{ steps.version.outputs.version }}' ${{ matrix.rid }} dist

      # Mounts the image and runs the app out of it the way a user first meets
      # it, so a bundle missing its executable, a plist key or the ad-hoc
      # signature fails here rather than on somebody's desktop. The signature is
      # what decides whether Gatekeeper calls a quarantined download "damaged"
      # (unrecoverable without a terminal) or "cannot be checked for malicious
      # software" (right-click -> Open clears it), so it is asserted rather than
      # assumed to have survived hdiutil.
      - name: Install check (.dmg)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg | head -1)
          mount_point=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          ls -la "$mount_point"

          app=$(find "$mount_point" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::no .app bundle in the mounted image" >&2; exit 1; }

          [ -L "$mount_point/Applications" ] || {
            echo "::error::.dmg is missing the /Applications symlink" >&2
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt || {
            echo "::error::the app bundle in the .dmg is not signed" >&2
            exit 1
          }

          "$app/Contents/MacOS/kubeNimbus" --smoke-test

      - name: Build .deb + .AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/linux/build-packages.sh
          ./scripts/linux/build-packages.sh \
            publish/${{ matrix.rid }} '${{ steps.version.outputs.version }}' ${{ matrix.rid }} dist

      # The .deb leg is the one that earns its runtime: apt resolves the
      # package's own Depends list, so a library the X11 backend loads and the
      # control file forgot fails here rather than on a minimal desktop install.
      # The AppImage runs with --appimage-extract-and-run because the runners
      # have no FUSE. The .tar.gz is deliberately not re-smoked: it is the same
      # staged bytes the launch check above already ran.
      - name: Install check (.deb, .AppImage)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.version.outputs.name }}"
          smoke() { xvfb-run -a --server-args="-screen 0 1280x800x24" "$@" --smoke-test; }

          chmod +x "dist/$base.AppImage"
          smoke "./dist/$base.AppImage" --appimage-extract-and-run

          sudo apt-get install -y "./dist/$base.deb"
          smoke /usr/bin/kubenimbus
          sudo apt-get remove -y kubenimbus

      # ---------------------------------------------------------------------
      # Microsoft Store package (win-x64 only). Built from the same publish
      # output the archive is staged from, so the Store gets exactly the binary
      # that just passed the launch check above.
      #
      # Deliberately NOT attached to the GitHub Release: the package is signed
      # with an ephemeral self-signed certificate, which nobody can install
      # without trusting that certificate first — the Store re-signs with its
      # own trusted certificate during certification, which is the whole point
      # of the channel. It ships as a CI artifact because Partner Center
      # submission is a manual download-and-upload. See CLAUDE.md, "Microsoft
      # Store (MSIX)".
      # ---------------------------------------------------------------------
      - name: Build MSIX (Microsoft Store submission)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: >-
          scripts/windows/build-msix.ps1
          -PublishDir publish/win-x64
          -Version ${{ steps.version.outputs.version }}
          -Output kubeNimbus-${{ steps.version.outputs.version }}-win-x64.msix

      - name: Upload MSIX artifact
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: kubeNimbus-*.msix
          if-no-files-found: error
          # The one artifact with no Release asset behind it: Partner Center
          # submission is manual, so it has to outlive the run rather than being
          # a same-run hand-off like the archives below. Two weeks, against the
          # account's 0.5 GB standing Actions storage budget (see CLAUDE.md).
          retention-days: 14

      # The AOT output carries .pdb/.dbg sidecars that quadruple the download
      # and are of no use to anyone who isn't debugging a stripped binary.
      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          staging="staging/${{ steps.version.outputs.name }}"
          mkdir -p "$staging"
          cp -r publish/${{ matrix.rid }}/. "$staging/"
          # win-x64 emits .pdb, linux-* a .dbg (108 MB against a 46 MB binary),
          # osx-* a .dsym bundle. Case varies by toolchain, hence both spellings.
          rm -f "$staging"/*.pdb "$staging"/*.dbg "$staging"/*.dwarf
          rm -rf "$staging"/*.dsym "$staging"/*.dSYM
          cp LICENSE README.md CHANGELOG.md "$staging/"
          ls -la "$staging"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          # Compress-Archive does not create the destination's parent directory
          # and fails outright when it is missing — which is what happened on
          # every win-x64 release run until v0.3.0, three steps after the binary
          # had already been built and smoke-tested. The tar leg below has always
          # created it; this one silently did not.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "staging/${{ steps.version.outputs.name }}" `
                           -DestinationPath "dist/${{ steps.version.outputs.name }}.zip" `
                           -CompressionLevel Optimal

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/${{ steps.version.outputs.name }}.tar.gz" \
              -C staging "${{ steps.version.outputs.name }}"

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" >> "$f.sha256"
            else
              shasum -a 256 "$f" >> "$f.sha256"
            fi
          done
          cat ./*.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          # Same-run hand-off to the "release" job, which republishes every file
          # as a GitHub Release asset — and Release assets do not count against
          # the Actions storage allowance, so a second week-long copy here buys
          # nothing. A workflow_dispatch test run (no "release" job) still
          # leaves the packages downloadable for the rest of the day.
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skipped for a dry run, so the workflow can be exercised end to end without
    # creating anything public.
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Anything with a pre-release suffix, and every 0.x, ships flagged as
          # a pre-release: kubeNimbus is pre-1.0 and shouldn't claim otherwise.
          if printf '%s' "$version" | grep -Eq '^0\.|-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the per-RID package artifacts, which are all named
      # kubeNimbus-<version>-<rid>. The pattern is what keeps `windows-msix` out
      # of the release: it is signed with an ephemeral self-signed certificate
      # for Partner Center, so anyone downloading it from a release page has a
      # package they cannot install. Every release up to and including v0.3.1
      # attached it anyway, because this step took every artifact in the run.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: kubeNimbus-*
          merge-multiple: true

      # One SHA256SUMS.txt beside the archives, rather than a .sha256 per file:
      # it's what `sha256sum -c` expects and what people look for.
      - name: Collect checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt
          ls -la

      # The CHANGELOG is the source of truth for release notes, so a release
      # can't say something the repository doesn't.
      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          # Stops at the next `## ` heading, and at the link-reference block the
          # file ends with — the last section would otherwise swallow it.
          if awk -v v="$version" '
                $0 ~ "^## \\[" v "\\]" { found = 1; next }
                found && /^## / { exit }
                found && /^\[[^]]+\]: / { exit }
                found { print }
              ' CHANGELOG.md > notes.md && [ -s notes.md ]; then
            echo "Found CHANGELOG section for $version"
          else
            # Degrade rather than fail: the binaries are already built, and a
            # thin release body is a doc fix, not a reason to lose the run.
            echo "::warning::No '## [$version]' section in CHANGELOG.md — release body will be the footer only"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for changes.\n' \
              "$GITHUB_REPOSITORY" > notes.md
          fi
          {
            echo
            echo '---'
            echo
            echo '**Binaries are unsigned.** Windows shows a SmartScreen prompt; macOS quarantines the app (`xattr -dr com.apple.quarantine <path>`). See the [README](https://github.com/Shman4ik/kubeNimbus#download) for per-platform instructions and verifying `SHA256SUMS.txt`.'
          } >> notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create '${{ steps.version.outputs.tag }}' \
            --title 'kubeNimbus ${{ steps.version.outputs.version }}' \
            --notes-file notes.md \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            artifacts/*
