name: Release

# Tag-driven. Everything a release needs is derived from the tag: the version
# stamped into the binaries, the archive names, and the CHANGELOG section used
# as the release body. See CONTRIBUTING.md, "Cutting a release".
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true
      dry_run:
        description: 'Build and archive everything, but do not create a release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One failed RID must not cancel the others: knowing that only osx-arm64
      # broke is the useful outcome, and the rest are still worth inspecting.
      fail-fast: false
      matrix:
        include:
          # NativeAOT cannot cross-compile — each RID needs a runner of its own
          # architecture and OS, which is what this matrix is.
          - { os: windows-latest,  rid: win-x64,     archive: zip }
          - { os: ubuntu-latest,   rid: linux-x64,   archive: tar }
          # Free for public repositories; see CONTRIBUTING.md if this label ever
          # stops resolving.
          - { os: ubuntu-24.04-arm, rid: linux-arm64, archive: tar }
          - { os: macos-latest,    rid: osx-arm64,   archive: tar }

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ILCompiler links with clang against zlib; the hosted images don't
      # guarantee the dev headers. Xvfb and the X client libraries are for the
      # launch check below — Avalonia's X11 backend dlopens exactly these seven
      # and nothing else native. Windows and macOS runners have a window server
      # already, so only Linux needs a display supplying.
      - name: Install AOT toolchain prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev \
            xvfb libice6 libsm6 libx11-6 libxcursor1 libxext6 libxi6 libxrandr2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # A malformed version would otherwise surface as an unusable archive
          # name three jobs later.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semantic version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=kubeNimbus-$version-${{ matrix.rid }}" >> "$GITHUB_OUTPUT"

      # -p:Version overrides Directory.Build.props's VersionPrefix, so the tag —
      # not the checked-in value — is what ends up stamped in the binary.
      - name: Publish (NativeAOT)
        shell: bash
        run: >-
          dotnet publish src/KubeNimbus.App
          -c Release
          -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      # ---------------------------------------------------------------------
      # Launch check. Deliberately BEFORE staging: a binary that cannot start
      # must fail its matrix leg rather than be archived, checksummed and
      # attached to a public release. That is not hypothetical — v0.1.0 shipped
      # three RIDs that died on startup with `FileNotFoundException: The
      # resource /Assets/app.ico could not be found`, because this workflow
      # published each binary and never once ran it. See
      # src/KubeNimbus.App/WindowIcons.cs for the bug and
      # src/KubeNimbus.App/SmokeTest.cs for what `--smoke-test` asserts: the
      # real startup path, exit 0 only once the main window has opened and
      # composited a frame.
      #
      # NativeAOT cannot cross-compile, which is why this matrix has a runner
      # per RID in the first place — so each runner can also natively run the
      # binary it just built. fail-fast is off, so one broken RID still leaves
      # the others' results visible, and the `release` job needs `build`, so a
      # failed leg blocks the release itself.
      #
      # Each leg carries timeout-minutes as a backstop below the app's own 90s
      # watchdog: a process wedged beneath the .NET runtime would otherwise sit
      # on the runner for the job's full 45 minutes.
      # ---------------------------------------------------------------------
      - name: Launch check (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" ./publish/${{ matrix.rid }}/kubeNimbus --smoke-test

      # Start-Process rather than the call operator: kubeNimbus.exe is built
      # WinExe (GUI subsystem), and PowerShell does not wait for a GUI-subsystem
      # child invoked with `&` — it returns immediately and leaves $LASTEXITCODE
      # meaningless, which would make this step pass unconditionally. -Wait
      # -PassThru gives a real exit code; the redirects then have to be echoed
      # by hand, since a GUI subsystem process has no console of its own.
      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = ".\publish\${{ matrix.rid }}\kubeNimbus.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' `
                             -Wait -PassThru -NoNewWindow `
                             -RedirectStandardOutput smoke-out.txt `
                             -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            throw "Launch check failed: $exe --smoke-test exited $($p.ExitCode). The published binary does not start."
          }

      - name: Launch check (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: ./publish/${{ matrix.rid }}/kubeNimbus --smoke-test

      # ---------------------------------------------------------------------
      # Microsoft Store package (win-x64 only). Built from the same publish
      # output the archive is staged from, so the Store gets exactly the binary
      # that just passed the launch check above.
      #
      # Deliberately NOT attached to the GitHub Release: the package is signed
      # with an ephemeral self-signed certificate, which nobody can install
      # without trusting that certificate first — the Store re-signs with its
      # own trusted certificate during certification, which is the whole point
      # of the channel. It ships as a CI artifact because Partner Center
      # submission is a manual download-and-upload. See CLAUDE.md, "Microsoft
      # Store (MSIX)".
      # ---------------------------------------------------------------------
      - name: Build MSIX (Microsoft Store submission)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: >-
          scripts/windows/build-msix.ps1
          -PublishDir publish/win-x64
          -Version ${{ steps.version.outputs.version }}
          -Output kubeNimbus-${{ steps.version.outputs.version }}-win-x64.msix

      - name: Upload MSIX artifact
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: kubeNimbus-*.msix
          if-no-files-found: error
          # The one artifact with no Release asset behind it: Partner Center
          # submission is manual, so it has to outlive the run rather than being
          # a same-run hand-off like the archives below. Two weeks, against the
          # account's 0.5 GB standing Actions storage budget (see CLAUDE.md).
          retention-days: 14

      # The AOT output carries .pdb/.dbg sidecars that quadruple the download
      # and are of no use to anyone who isn't debugging a stripped binary.
      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          staging="staging/${{ steps.version.outputs.name }}"
          mkdir -p "$staging"
          cp -r publish/${{ matrix.rid }}/. "$staging/"
          # win-x64 emits .pdb, linux-* a .dbg (108 MB against a 46 MB binary),
          # osx-* a .dsym bundle. Case varies by toolchain, hence both spellings.
          rm -f "$staging"/*.pdb "$staging"/*.dbg "$staging"/*.dwarf
          rm -rf "$staging"/*.dsym "$staging"/*.dSYM
          cp LICENSE README.md CHANGELOG.md "$staging/"
          ls -la "$staging"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          # Compress-Archive does not create the destination's parent directory
          # and fails outright when it is missing — which is what happened on
          # every win-x64 release run until v0.3.0, three steps after the binary
          # had already been built and smoke-tested. The tar leg below has always
          # created it; this one silently did not.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "staging/${{ steps.version.outputs.name }}" `
                           -DestinationPath "dist/${{ steps.version.outputs.name }}.zip" `
                           -CompressionLevel Optimal

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/${{ steps.version.outputs.name }}.tar.gz" \
              -C staging "${{ steps.version.outputs.name }}"

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" >> "$f.sha256"
            else
              shasum -a 256 "$f" >> "$f.sha256"
            fi
          done
          cat ./*.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error
          # Same-run hand-off to the "release" job, which republishes every file
          # as a GitHub Release asset — and Release assets do not count against
          # the Actions storage allowance, so a second week-long copy here buys
          # nothing. A workflow_dispatch test run (no "release" job) still
          # leaves the packages downloadable for the rest of the day.
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skipped for a dry run, so the workflow can be exercised end to end without
    # creating anything public.
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Anything with a pre-release suffix, and every 0.x, ships flagged as
          # a pre-release: kubeNimbus is pre-1.0 and shouldn't claim otherwise.
          if printf '%s' "$version" | grep -Eq '^0\.|-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # `pattern` is load-bearing, not tidiness: without it this step also collects
      # `windows-msix`, and the next steps hand everything in `artifacts/` to
      # `gh release create`. v0.3.1 published that way — a self-signed .msix, which
      # nobody can install without first trusting a throwaway certificate, offered
      # for download beside the four archives and absent from SHA256SUMS.txt
      # because the checksum step never saw it. The MSIX exists for Partner Center
      # only; the Store re-signs it during certification. Artifact names are
      # `kubeNimbus-<version>-<rid>`, so this pattern takes the archives and
      # nothing else.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: kubeNimbus-*
          merge-multiple: true

      # One SHA256SUMS.txt beside the archives, rather than a .sha256 per file:
      # it's what `sha256sum -c` expects and what people look for.
      - name: Collect checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt
          ls -la

      # The CHANGELOG is the source of truth for release notes, so a release
      # can't say something the repository doesn't.
      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          # Stops at the next `## ` heading, and at the link-reference block the
          # file ends with — the last section would otherwise swallow it.
          if awk -v v="$version" '
                $0 ~ "^## \\[" v "\\]" { found = 1; next }
                found && /^## / { exit }
                found && /^\[[^]]+\]: / { exit }
                found { print }
              ' CHANGELOG.md > notes.md && [ -s notes.md ]; then
            echo "Found CHANGELOG section for $version"
          else
            # Degrade rather than fail: the binaries are already built, and a
            # thin release body is a doc fix, not a reason to lose the run.
            echo "::warning::No '## [$version]' section in CHANGELOG.md — release body will be the footer only"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for changes.\n' \
              "$GITHUB_REPOSITORY" > notes.md
          fi
          {
            echo
            echo '---'
            echo
            echo '**Binaries are unsigned.** Windows shows a SmartScreen prompt; macOS quarantines the app (`xattr -dr com.apple.quarantine <path>`). See the [README](https://github.com/Shman4ik/kubeNimbus#download) for per-platform instructions and verifying `SHA256SUMS.txt`.'
          } >> notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create '${{ steps.version.outputs.tag }}' \
            --title 'kubeNimbus ${{ steps.version.outputs.version }}' \
            --notes-file notes.md \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            artifacts/*
