version: 2

updates:
  # NuGet. Grouped so an Avalonia bump arrives as one PR across all six
  # Avalonia packages — they are version-locked in practice, and splitting them
  # produces PRs that can't build on their own.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      kubernetes-client:
        patterns:
          - "KubernetesClient*"
      test-tooling:
        patterns:
          - "TUnit*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns:
          - "*"
