version: 2

updates:
  # NuGet. Grouped so an Avalonia bump arrives as one PR across all six
  # Avalonia packages — they are version-locked in practice, and splitting them
  # produces PRs that can't build on their own.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # shared/nimbusUi is a subtree of the nimbusUi repository, which owns it. Its
    # Avalonia references are a deliberate floor (the lowest version either app is
    # on), not a version to keep current, and a bump made here is an edit to a
    # shared file that nimbusUi and pgNimbus never see — #83 did exactly that, and
    # the three copies of Nimbus.Ui.csproj ended up on three different versions.
    exclude-paths:
      - "shared/nimbusUi/**"
    groups:
      # SvcSystems.UI.Terminal is an Avalonia control that moves with the Avalonia
      # monorepo. Outside this group, a terminal release that needed a newer
      # Avalonia arrived as its own PR that bumped `Avalonia` alone (#80), leaving
      # Desktop and Fluent a version behind it.
      avalonia:
        patterns:
          - "Avalonia*"
          - "SvcSystems.UI.Terminal"
      kubernetes-client:
        patterns:
          - "KubernetesClient*"
      test-tooling:
        patterns:
          - "TUnit*"
    # No ignores. YamlDotNet used to be ignored here, because KubernetesClient.Aot's
    # own kubeconfig reader only works with the YamlDotNet it was compiled against
    # (#15, #21, #77). KubeconfigReader reads kubeconfig without it and
    # BannedSymbols.txt keeps it that way, so YamlDotNet is bumped like any other
    # package, and the Core tests are what check a bump.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns:
          - "*"
