name: Bug report
description: Something in kubeNimbus doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Two things make a Kubernetes-client bug actionable
        faster than anything else: **which cluster** you hit it against, and
        whether it reproduces against the throwaway sandbox cluster
        (`./scripts/sandbox-up.sh`). Please fill those in if you can.

        Found a security vulnerability? **Don't file it here** — see
        [SECURITY.md](https://github.com/Shman4ik/kubeNimbus/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Connected to context `prod-eu`
        2. Selected Workloads → Pods
        3. Expected the list to populate; it stayed on "Loading" indefinitely.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: kubeNimbus version
      description: The release tag, or the commit SHA if you built from source.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: cluster
    attributes:
      label: Cluster distribution and version
      description: >-
        Run `kubectl version` if you're unsure. Managed clusters often differ
        from vanilla Kubernetes in exactly the areas this app touches
        (discovery, aggregated APIs, RBAC, websockets).
      placeholder: EKS 1.31 / k3s v1.33.4 / kind 1.30 / OpenShift 4.16
    validations:
      required: true

  - type: dropdown
    id: sandbox
    attributes:
      label: Does it reproduce against the sandbox cluster?
      description: >-
        `./scripts/sandbox-up.sh` (or `.ps1`) brings up a preloaded single-node
        k3s cluster in Docker. If the bug reproduces there, it's nearly fixed
        already.
      options:
        - "Yes — reproduces on the sandbox cluster"
        - "No — only on my own cluster"
        - "Haven't tried"
    validations:
      required: true

  - type: dropdown
    id: auth
    attributes:
      label: How does your kubeconfig authenticate?
      description: Exec-plugin auth is a common source of connection bugs.
      options:
        - Client certificate
        - Static token / service account token
        - "Exec plugin (aws eks get-token, gke-gcloud-auth-plugin, kubelogin, …)"
        - OIDC
        - Not sure
        - Not relevant to this bug
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Errors, logs or screenshots
      description: >-
        Anything the app displayed, plus console output if you launched it from
        a terminal. **Redact cluster names, hostnames and any token before
        pasting.**
      render: text
    validations:
      required: false
